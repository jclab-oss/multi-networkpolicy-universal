on:
  push:
    branches:
      - main
      - master
      - nftables
  pull_request:
name: test
permissions:
  contents: read
jobs:
  test:
    env:
      NFTEST_SKIP_IF_UNAVAILABLE: "1"
    strategy:
      matrix:
        go-version: ["1.25.13"]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Run Revive Action by pulling pre-built image
      uses: docker://morphy/revive-action:v2
      with:
        exclude: "./vendor/..."

    - name: Run go fmt
      run: make fmt

    - name: Run go vet
      run: make vet

    # Same gate change as in govulncheck.yml. A vulnerability report must not
    # stop the fmt, vet and test steps that follow it in this job.
    - name: Run govulncheck
      id: govulncheck
      continue-on-error: true
      run: make govulncheck

    - name: Report govulncheck outcome
      if: steps.govulncheck.outcome == 'failure'
      run: |
        echo "::warning::govulncheck reported findings. Read the 'Run govulncheck' step for the details. This does not fail CI."

    - name: Run go env toolchain
      run: go env -w GOTOOLCHAIN=go${{ matrix.go-version }}+auto

    - name: Install envtest assets
      run: |
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1
        mkdir -p testbin/k8s
        echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.35.0 --bin-dir testbin/k8s -p path)" >> "$GITHUB_ENV"

    - name: Load kernel modules
      run: sudo modprobe nft_ct

    # The TCX datapath tests in pkg/tcx run with the privileged suite below;
    # they need Linux 6.6+ and bpffs, which the runner provides.
    - name: Show kernel
      run: uname -r && mount -t bpf

    - name: Test unprivileged packages
      run: make test-unprivileged

    - name: Test all packages with nftables
      run: make test

    - name: Send coverage
      uses: shogo82148/actions-goveralls@v1
      continue-on-error: true
      with:
        path-to-profile: profile.cov
        flag-name: "Go-${{ matrix.go-version }}-${{ matrix.os }}"
        parallel: true

  verify-bpf:
    # The committed BPF object must match bpf/policy.c. Ubuntu 24.04's clang
    # (18.1.3) produces it byte for byte; see "BPF program" in README.md.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Install clang
      run: sudo apt-get install -y clang llvm

    - name: Verify the BPF object is up to date
      run: make verify-bpf

  # notifies that all test jobs are finished.
  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          parallel-finished: true
