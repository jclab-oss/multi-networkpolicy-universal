# A Kata pod on the Rust runtime ("tcfilter" networking) whose egress on net1
# is limited to pod-b on TCP 5555. pod-b and pod-c listen on 5555 and 6666.
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  namespace: default
  name: macvlan-kata-rs
spec:
  config: '{
            "cniVersion": "0.3.1",
            "name": "macvlan-kata-rs",
            "plugins": [
                {
                    "type": "macvlan",
                    "mode": "bridge",
                    "ipam":{
                      "type":"host-local",
                      "subnet":"2.2.21.0/24",
                      "rangeStart":"2.2.21.8",
                      "rangeEnd":"2.2.21.67"
                    }
                }]
        }'
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-kata-rs
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-a
  namespace: test-kata-rs
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-rs
  labels:
    app: test-kata-rs
    name: pod-a
spec:
  runtimeClassName: kata-qemu-runtime-rs
  terminationGracePeriodSeconds: 0
  containers:
  - name: a
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-b
  namespace: test-kata-rs
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-rs
  labels:
    app: test-kata-rs
    name: pod-b
spec:
  runtimeClassName: kata-qemu-runtime-rs
  terminationGracePeriodSeconds: 0
  containers:
  - name: b5555
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
  - name: b6666
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "6666"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-c
  namespace: test-kata-rs
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-rs
  labels:
    app: test-kata-rs
    name: pod-c
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: c5555
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: test-kata-rs-egress
  namespace: test-kata-rs
  annotations:
    k8s.v1.cni.cncf.io/policy-for: default/macvlan-kata-rs
spec:
  podSelector:
    matchLabels:
      name: pod-a
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          name: pod-b
    ports:
    - protocol: TCP
      port: 5555
