# kata-deploy settings for the Kata e2e suite: the QEMU shims of both Kata
# runtimes with their default "tcfilter" networking, plus a QEMU runtime that
# uses "macvtap" networking.
imagePullPolicy: IfNotPresent
snapshotter:
  setup: []
shims:
  disableAll: true
  qemu:
    enabled: true
  qemu-runtime-rs:
    enabled: true
customRuntimes:
  enabled: true
  runtimes:
    qemu-macvtap:
      baseConfig: qemu
      dropIn: |
        [runtime]
        internetworking_model = "macvtap"
      runtimeClass: |
        kind: RuntimeClass
        apiVersion: node.k8s.io/v1
        metadata:
          name: kata-qemu-macvtap
          labels:
            app.kubernetes.io/managed-by: kata-deploy
        handler: kata-qemu-macvtap
        scheduling:
          nodeSelector:
            katacontainers.io/kata-runtime: "true"
