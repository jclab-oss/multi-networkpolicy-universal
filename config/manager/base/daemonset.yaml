apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: multi-networkpolicy-ds-amd64
  namespace: kube-system
  labels:
    tier: node
    app: multi-networkpolicy
    name: multi-networkpolicy
spec:
  selector:
    matchLabels:
      name: multi-networkpolicy
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        tier: node
        app: multi-networkpolicy
        name: multi-networkpolicy
    spec:
      hostNetwork: true
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - operator: Exists
          effect: NoSchedule
      serviceAccountName: multi-networkpolicy
      containers:
        - name: multi-networkpolicy
          image: ghcr.io/telekom/multi-networkpolicy-nftables
          imagePullPolicy: Always
          command:
            - /usr/bin/multi-networkpolicy-nftables
          args:
            - --host-prefix=/host
            - --container-runtime-endpoint=/run/crio/crio.sock
            - --health-port=8081
            - --health-bind-address=127.0.0.1
          ports:
            - name: health
              containerPort: 8081
              hostPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
              host: 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
              host: 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 80Mi
            limits:
              cpu: 100m
              memory: 150Mi
          securityContext:
            # The default container AppArmor profile only allows ptrace of peers under
            # the same profile, which blocks reading /proc/<pid>/ns/net of pods run by
            # a sandboxed runtime regardless of CAP_SYS_PTRACE.
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                # Reading /proc/<pid>/ns/net of another pod's process is subject to
                # a ptrace access check, which fails without this capability when the
                # target process lives in a different user namespace or runs as a
                # different user, as with sandboxed runtimes.
                - SYS_PTRACE
          volumeMounts:
            - name: host
              mountPath: /host
              readOnly: true
      volumes:
        - name: host
          hostPath:
            path: /
