# Kata pods whose primary network is a net-attach-def, selected with the
# Multus "v1.multus-cni.io/default-network" annotation: the policed interface
# is eth0 and there is no k8s.v1.cni.cncf.io/networks annotation. The server
# uses RuntimeClass kata-qemu; client-a is a runc pod, client-b a Kata pod.
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  namespace: default
  name: macvlan-kata-defnet
spec:
  config: '{
            "cniVersion": "0.3.1",
            "name": "macvlan-kata-defnet",
            "plugins": [
                {
                    "type": "macvlan",
                    "mode": "bridge",
                    "capabilities": {"ips": true },
                    "ipam":{
                      "type":"static"
                    }
                }]
        }'
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-kata-defnet
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-server
  namespace: test-kata-defnet
  annotations:
    v1.multus-cni.io/default-network: '[{"name":"macvlan-kata-defnet","namespace":"default","ips":["2.2.43.1/24"]}]'
  labels:
    app: test-kata-defnet
    name: pod-server
spec:
  runtimeClassName: kata-qemu
  terminationGracePeriodSeconds: 0
  containers:
  - name: nc
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-a
  namespace: test-kata-defnet
  annotations:
    v1.multus-cni.io/default-network: '[{"name":"macvlan-kata-defnet","namespace":"default","ips":["2.2.43.11/24"]}]'
  labels:
    app: test-kata-defnet
    name: pod-client-a
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: nc
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-b
  namespace: test-kata-defnet
  annotations:
    v1.multus-cni.io/default-network: '[{"name":"macvlan-kata-defnet","namespace":"default","ips":["2.2.43.12/24"]}]'
  labels:
    app: test-kata-defnet
    name: pod-client-b
spec:
  runtimeClassName: kata-qemu
  terminationGracePeriodSeconds: 0
  containers:
  - name: nc
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
---
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: test-kata-defnet-ingress
  namespace: test-kata-defnet
  annotations:
    k8s.v1.cni.cncf.io/policy-for: default/macvlan-kata-defnet
spec:
  podSelector:
    matchLabels:
      name: pod-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: pod-client-a
