name: e2e-kata
permissions:
  contents: read
on:
  push:
    branches:
      - main
      - master
      - nftables
  pull_request:
jobs:
  e2e-kata:
    # Kata Containers runs its VMs with KVM, which the GitHub-hosted Linux
    # runners expose. The kind nodes are privileged containers and see
    # /dev/kvm; the runner kernel provides TCX (Linux 6.6+).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      checks: write
      contents: read
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          uname -r

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Get tools
        working-directory: ./e2e
        run: ./get_tools.sh

      - name: Setup cluster
        working-directory: ./e2e
        run: KATA_E2E_HOST_DEVTMPFS=1 ./kata/setup_cluster.sh

      - name: "Test: kata"
        working-directory: ./e2e
        run: |
          export TERM=dumb
          ./kata/run_tests.sh

      - name: Collect logs
        if: ${{ failure() }}
        working-directory: ./e2e
        run: |
          mkdir -p artifacts
          ./bin/kind export logs --name kata ./artifacts/kind-logs || true
          ./bin/kubectl get pods -A -o wide > ./artifacts/pods.txt 2>&1 || true
          ./bin/kubectl -n kube-system logs -l name=multi-networkpolicy --tail=-1 --prefix > ./artifacts/daemon.log 2>&1 || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: kind-logs-e2e-kata
          path: ./e2e/artifacts/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-kata-test-results
          path: ./e2e/artifacts/junit/
          if-no-files-found: ignore

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always() && hashFiles('./e2e/artifacts/junit/*.xml') != ''
        continue-on-error: true
        with:
          name: E2E Kata Test Results
          path: ./e2e/artifacts/junit/*.xml
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
          fail-on-empty: 'false'
