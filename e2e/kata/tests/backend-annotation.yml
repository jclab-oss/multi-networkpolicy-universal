# The multinetworkpolicy.io/backend annotation overrides the backend chosen
# from the RuntimeClass: a runc pod asks for "tcx", a Kata pod for
# "nftables". Both servers are selected by one ingress policy that allows
# client-a only.
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  namespace: default
  name: macvlan-kata-backend
spec:
  config: '{
            "cniVersion": "0.3.1",
            "name": "macvlan-kata-backend",
            "plugins": [
                {
                    "type": "macvlan",
                    "mode": "bridge",
                    "ipam":{
                      "type":"host-local",
                      "subnet":"2.2.23.0/24",
                      "rangeStart":"2.2.23.8",
                      "rangeEnd":"2.2.23.67"
                    }
                }]
        }'
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-kata-backend
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-runc-server
  namespace: test-kata-backend
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-backend
    multinetworkpolicy.io/backend: tcx
  labels:
    app: test-kata-backend
    role: server
    name: pod-runc-server
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: nc
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-kata-server
  namespace: test-kata-backend
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-backend
    multinetworkpolicy.io/backend: nftables
  labels:
    app: test-kata-backend
    role: server
    name: pod-kata-server
spec:
  runtimeClassName: kata-qemu
  terminationGracePeriodSeconds: 0
  containers:
  - name: nc
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-a
  namespace: test-kata-backend
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-backend
  labels:
    app: test-kata-backend
    role: client-a
    name: pod-client-a
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: nc
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-b
  namespace: test-kata-backend
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-backend
  labels:
    app: test-kata-backend
    role: client-b
    name: pod-client-b
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: nc
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: test-kata-backend-ingress
  namespace: test-kata-backend
  annotations:
    k8s.v1.cni.cncf.io/policy-for: default/macvlan-kata-backend
spec:
  podSelector:
    matchLabels:
      role: server
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: client-a
