# A Kata pod with "macvtap" networking (a macvtap device on top of net1 instead
# of a TC redirect) that accepts ingress from client-a on TCP 5555. IPv4 only:
# in the kind cluster, IPv6 neighbor discovery towards a macvtap-attached Kata
# VM fails even without this daemon; IPv6 is covered by the tcfilter suite.
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  namespace: default
  name: macvlan-kata-macvtap
spec:
  config: '{
            "cniVersion": "0.3.1",
            "name": "macvlan-kata-macvtap",
            "plugins": [
                {
                    "type": "macvlan",
                    "mode": "bridge",
                    "ipam":{
                      "type":"host-local",
                      "subnet":"2.2.22.0/24",
                      "rangeStart":"2.2.22.8",
                      "rangeEnd":"2.2.22.67"
                    }
                }]
        }'
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-kata-macvtap
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-server
  namespace: test-kata-macvtap
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-macvtap
  labels:
    app: test-kata-macvtap
    name: pod-server
spec:
  runtimeClassName: kata-qemu-macvtap
  terminationGracePeriodSeconds: 0
  containers:
  - name: s5555
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
  - name: s6666
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "6666"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-a
  namespace: test-kata-macvtap
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-macvtap
  labels:
    app: test-kata-macvtap
    name: pod-client-a
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: client
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-b
  namespace: test-kata-macvtap
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan-kata-macvtap
  labels:
    app: test-kata-macvtap
    name: pod-client-b
spec:
  runtimeClassName: kata-qemu-macvtap
  terminationGracePeriodSeconds: 0
  containers:
  - name: client
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
---
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: test-kata-macvtap-ingress
  namespace: test-kata-macvtap
  annotations:
    k8s.v1.cni.cncf.io/policy-for: default/macvlan-kata-macvtap
spec:
  podSelector:
    matchLabels:
      name: pod-server
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: pod-client-a
    ports:
    - protocol: TCP
      port: 5555
